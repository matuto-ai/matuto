name: validate

on:
  push:
  pull_request:

# Supersede only the same PR; pushes keep independent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested tree and runner
        run: printf 'CI_RUNTIME_TREE %s %s ubuntu-24.04\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Detect test applicability
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          only_exempt_paths() (
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git cat-file -e "$base^{commit}" 2>/dev/null || exit 1
            changes="$(mktemp)" || exit 1
            trap 'rm -f "$changes"' EXIT
            # Keep source deletions visible when files move into an exempt folder.
            git diff --name-only -z --no-renames "$base" HEAD -- > "$changes" || exit 1
            [[ -s "$changes" ]] || exit 1
            while IFS= read -r -d '' path; do
              case "$path" in
                # Extend only with folders that have no runtime, test, or build inputs.
                docs/*) ;;
                *) exit 1 ;;
              esac
            done < "$changes"
          )

          skip_tests=false
          if only_exempt_paths; then
            skip_tests=true
          fi
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

      - name: Check validation prerequisites
        if: steps.changes.outputs.skip_tests != 'true'
        run: |
          command -v shellcheck
          command -v node

      - name: Validate changed files
        id: validation
        if: steps.changes.outputs.skip_tests != 'true'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if ./agents/ci-docs-only "$CI_BASE_SHA"; then
            echo 'PASS: documentation-only change; runtime validation is not applicable.'
          elif ./agents/ci-wq-only "$CI_BASE_SHA"; then
            echo 'PASS: WQ-only change; manager regression is not applicable.'
            ./validate.sh --wq-only
          else
            ./validate.sh | tee "$RUNNER_TEMP/matuto-validation.log"
            echo 'full=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check runtime growth against exact main baseline
        if: github.event_name == 'pull_request' && steps.validation.outputs.full == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B agents/ci_runtime_budget.py check --base "$CI_BASE_SHA" --log "$RUNNER_TEMP/matuto-validation.log"

      - name: Report tests not applicable
        if: steps.changes.outputs.skip_tests == 'true'
        run: |
          echo 'PASS: documentation-only change; runtime validation is not applicable.'
