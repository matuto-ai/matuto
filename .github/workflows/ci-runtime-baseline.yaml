name: CI runtime baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: read

jobs:
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Promote the merged PR measurement or inherit a documentation baseline
        id: promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if python3 -B agents/ci_runtime_budget.py promote --commit "$MERGE_SHA"; then
            exit 0
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            echo 'measure=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Measure full validation after a WQ-only PR
        if: steps.promotion.outputs.measure == 'true'
        run: |
          set -euo pipefail
          command -v shellcheck
          command -v node
          ./validate.sh | tee "$RUNNER_TEMP/matuto-validation.log"
      - name: Record the WQ merge measurement for this exact main commit
        if: steps.promotion.outputs.measure == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -B agents/ci_runtime_budget.py seed --commit "$MAIN_SHA" --log "$RUNNER_TEMP/matuto-validation.log" --run-url "$RUN_URL"

  measure-main:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Explicitly requested full-main recovery measurement
        run: |
          set -euo pipefail
          command -v shellcheck
          command -v node
          ./validate.sh | tee "$RUNNER_TEMP/matuto-validation.log"
      - name: Record the recovery measurement for this exact main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -B agents/ci_runtime_budget.py seed --commit "$MAIN_SHA" --log "$RUNNER_TEMP/matuto-validation.log" --run-url "$RUN_URL"
